# Build Open WebUI .deb and publish to the private APT repository.
# Publishes automatically on updates to experiments, or manually from Actions.
name: Deploy Debian APT

on:
  push:
    branches:
      - experiments
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (empty = package.json version)"
        required: false
        type: string
      codename:
        description: "APT codename (must match reprepro distributions)"
        required: true
        default: "jammy"
        type: string

concurrency:
  group: deb-publish-open-webui
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: pkg
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(node -pe "require('./package.json').version")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building open-webui version ${VERSION} (${{ matrix.arch }})"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential python3.12 python3.12-venv
          sudo gem install fpm --no-document

      - name: Build .deb
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
          ARCH: ${{ matrix.arch }}
          PYTHON: /usr/bin/python3.12
        run: |
          chmod +x packaging/deb/build.sh
          packaging/deb/build.sh
          ls -l "packaging/deb/build/open-webui_${VERSION}_${{ matrix.arch }}.deb"
          readlink -f packaging/deb/build/pkgroot/opt/open-webui/venv/bin/python3

      - name: Upload .deb to APT server
        env:
          RAW_SSH_KEY: ${{ secrets.APT_SERVER_SSH_KEY }}
          RAW_HOST: ${{ secrets.APT_SERVER_HOST }}
          RAW_USER: ${{ secrets.APT_SERVER_USER }}
          VERSION: ${{ steps.pkg.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          SSH_KEY=$(echo "$RAW_SSH_KEY" | tr -d '\r')
          HOST=$(echo "$RAW_HOST" | tr -d '\r' | xargs)
          USER=$(echo "$RAW_USER" | tr -d '\r' | xargs)
          DEB_FILE="packaging/deb/build/open-webui_${VERSION}_${ARCH}.deb"

          if [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "ERROR: APT_SERVER_HOST or APT_SERVER_USER is empty."
            exit 1
          fi

          if [ ! -f "$DEB_FILE" ]; then
            echo "ERROR: $DEB_FILE not found."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa,ed25519 "$HOST" >> ~/.ssh/known_hosts

          ssh "$USER@$HOST" "mkdir -p /tmp/open-webui-deploy"
          scp "$DEB_FILE" "$USER@$HOST:/tmp/open-webui-deploy/"

      - name: Ingest into reprepro
        env:
          RAW_SSH_KEY: ${{ secrets.APT_SERVER_SSH_KEY }}
          RAW_HOST: ${{ secrets.APT_SERVER_HOST }}
          RAW_USER: ${{ secrets.APT_SERVER_USER }}
          RAW_REPO_PATH: ${{ secrets.APT_REPO_PATH }}
          INPUT_CODENAME: ${{ github.event.inputs.codename }}
          VERSION: ${{ steps.pkg.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          SSH_KEY=$(echo "$RAW_SSH_KEY" | tr -d '\r')
          HOST=$(echo "$RAW_HOST" | tr -d '\r' | xargs)
          USER=$(echo "$RAW_USER" | tr -d '\r' | xargs)
          REPO_PATH=$(echo "$RAW_REPO_PATH" | tr -d '\r' | xargs)
          CODENAME="${INPUT_CODENAME:-jammy}"
          REMOTE_DEB="/tmp/open-webui-deploy/open-webui_${VERSION}_${ARCH}.deb"

          if [ -z "$REPO_PATH" ]; then
            echo "ERROR: APT_REPO_PATH is empty."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa,ed25519 "$HOST" >> ~/.ssh/known_hosts

          echo "Ingesting into reprepro (codename=${CODENAME}, arch=${ARCH})..."
          ssh "$USER@$HOST" \
            "reprepro -b ${REPO_PATH} includedeb ${CODENAME} ${REMOTE_DEB} && rm -f ${REMOTE_DEB} && reprepro -b ${REPO_PATH} list ${CODENAME}"
